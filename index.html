<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中文打字挑战 - 饮食健康</title>
    <!-- 使用外部 Tailwind CSS CDN 确保样式在 SLS 中生效 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght=400;700&display=swap');

        body {
            font-family: 'Noto Sans SC', sans-serif;
            background-color: #f0fdf4; /* 饮食健康主题，使用舒适的淡绿色调 */
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        .typing-container {
            background: white;
            padding: 2.5rem 2rem 2rem 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 95%;
            max-width: 800px;
            text-align: center;
            position: relative;
            margin: 1rem;
        }

        /* 顶部全局路线图样式 */
        .roadmap-container {
            user-select: none;
            -webkit-user-select: none;
        }

        .target-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .target-text {
            font-size: clamp(2rem, 6vw, 3.5rem);
            letter-spacing: 0.2rem;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            line-height: 1.4;
            /* 严格阻止用户选中、右键、拖拽和复制文本 */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            pointer-events: none;
        }

        .char {
            transition: all 0.2s ease;
            display: inline-block;
            border-bottom: 3px solid transparent;
        }

        .char.default { color: #4b5563; }
        .char.correct { color: #10b981; font-weight: bold; } /* 绿色表示正确 */
        .char.wrong { 
            color: #ef4444; 
            animation: shake 0.3s;
        }

        .input-line {
            width: 100%;
            border: none;
            border-bottom: 4px solid #cbd5e1;
            font-size: clamp(1.5rem, 5vw, 2.2rem);
            text-align: center;
            padding: 0.8rem;
            outline: none;
            background: transparent;
            transition: border-color 0.3s;
        }

        .input-line:focus {
            border-color: #10b981;
        }

        .audio-btn {
            background: #f0fdf4;
            color: #059669;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            pointer-events: auto; /* 确保发音按钮可以点击 */
        }

        .audio-btn:hover {
            background: #dcfce7;
            transform: scale(1.1);
        }

        .hint-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #f0fdf4;
            color: #059669;
            border: 1px solid #bcf0da;
            padding: 0.4rem 0.8rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
            z-index: 10;
        }

        .star-rating {
            font-size: 2.5rem;
            color: #fbbf24;
            margin: 1rem 0;
            letter-spacing: 0.3rem;
        }

        .hidden { display: none !important; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        .celebration-bg {
            background: linear-gradient(135deg, #34d399 0%, #059669 100%);
        }

        /* 引导继续挑战按钮的动效 */
        .pulse-btn {
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            }
            70% {
                transform: scale(1.05);
                box-shadow: 0 0 0 10px rgba(16, 185, 129, 0);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
            }
        }

        @media (max-width: 640px) {
            .typing-container { padding: 1.5rem; }
            .hint-btn { top: 0.5rem; right: 0.5rem; }
            .audio-btn { width: 40px; height: 40px; }
            .target-text { font-size: 1.8rem; }
        }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<div class="typing-container" id="game-container">
    <!-- 提示按钮 -->
    <button id="hint-trigger" class="hint-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        查看提示
    </button>

    <!-- 置顶全局双关路线进度条（让学生时刻看清当前大目标） -->
    <div class="roadmap-container max-w-md mx-auto mb-8 mt-2 px-4">
        <div class="flex items-center justify-between relative">
            <!-- 第一关节点 -->
            <div class="flex flex-col items-center z-10">
                <div id="node-1" class="w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-sm shadow-md border-4 border-white transition-all duration-300">
                    1
                </div>
                <span id="label-1" class="text-xs font-bold text-emerald-600 mt-2">词语练习</span>
            </div>
            
            <!-- 连接进度线 -->
            <div class="absolute left-0 right-0 top-5 h-1.5 bg-gray-200 -z-10 rounded-full">
                <div id="roadmap-line" class="h-full bg-emerald-500 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            
            <!-- 第二关节点 -->
            <div class="flex flex-col items-center z-10">
                <div id="node-2" class="w-10 h-10 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-sm shadow-sm border-4 border-white transition-all duration-300">
                    2
                </div>
                <span id="label-2" class="text-xs font-medium text-gray-400 mt-2">句子挑战</span>
            </div>
        </div>
    </div>

    <!-- 打写主界面 -->
    <div id="game-content">
        <div id="level-indicator" class="text-emerald-600 font-bold tracking-widest text-sm sm:text-base mb-1">主题：健康生活 - 饮食健康</div>
        <div id="progress" class="text-gray-400 text-xs mb-4">当前进度: 1 / 12</div>

        <div class="target-area">
            <div id="target-display" class="target-text"></div>
            <button id="speak-btn" class="audio-btn" title="朗读内容">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </button>
        </div>

        <div class="input-wrapper">
            <input type="text" id="type-input" class="input-line" placeholder="请在这里输入中文..." autocomplete="off">
        </div>
    </div>

    <!-- 结算关卡界面（进度路线仍会在顶部显示） -->
    <div id="result-screen" class="hidden animate-in fade-in zoom-in duration-500 text-center">
        <h2 class="text-2xl font-bold mb-2 text-gray-800">本关表现</h2>
        <div id="stars" class="star-rating"></div>
        <div class="text-gray-600 mb-6">
            <p>准确率: <span id="accuracy-val" class="font-bold text-emerald-600 text-xl">0%</span></p>
            <p>所用时间: <span id="time-val" class="font-bold text-emerald-600 text-xl">0秒</span></p>
        </div>
        <div class="flex flex-col sm:flex-row justify-center gap-3">
            <button onclick="restartLevel()" class="px-6 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-xl font-bold transition">再试一次</button>
            <button id="next-btn" onclick="goToNextLevel()" class="pulse-btn px-8 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-black transition shadow-lg shadow-emerald-200">继续下一关</button>
        </div>
    </div>

    <!-- 通关欢庆全屏界面 -->
    <div id="final-celebration" class="hidden fixed inset-0 celebration-bg flex flex-col items-center justify-center z-[100] text-white p-6 animate-in fade-in duration-700">
        <div class="text-8xl mb-6 animate-bounce">🥗</div>
        <h1 class="text-4xl sm:text-5xl font-bold mb-4">全关通关成功！</h1>
        <p class="text-xl sm:text-2xl text-emerald-50 mb-8 max-w-md">你已经顺利完成了“饮食健康”主题的所有挑战！🌟</p>
        <div class="bg-white/20 backdrop-blur-md rounded-3xl p-8 mb-8 text-center border border-white/30 shadow-2xl">
            <p class="text-lg opacity-90">合理膳食，营养均衡，健康生活 👏</p>
            <p class="text-sm mt-2 opacity-75">华文练习，更上一层楼</p>
        </div>
        <button onclick="location.reload()" class="px-10 py-4 bg-white text-emerald-600 rounded-full font-black text-xl hover:bg-emerald-50 transition transform hover:scale-105 shadow-xl">
            重新练习一次
        </button>
    </div>
</div>

<!-- 提示框 -->
<div id="hint-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
        <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
            <span class="text-emerald-500">💡</span> 学习提示
        </h3>
        <div class="space-y-4 text-left">
            <div>
                <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">拼音 Pinyin</p>
                <p id="hint-pinyin" class="text-lg text-emerald-600 font-bold"></p>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">英文 English</p>
                <p id="hint-english" class="text-gray-700"></p>
            </div>
            <div>
                <p class="text-[10px] text-gray-400 uppercase font-bold tracking-wider">解释 / 用法 Meaning</p>
                <p id="hint-chinese" class="text-gray-700 text-sm leading-relaxed"></p>
            </div>
        </div>
        <button id="close-hint" class="w-full mt-6 py-3 bg-emerald-500 text-white rounded-xl font-bold hover:bg-emerald-600 transition shadow-lg shadow-emerald-200">知道了</button>
    </div>
</div>

<audio id="error-sound" preload="auto">
    <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
</audio>

<script>
    const levels = [
        {
            title: "第一关：词语练习",
            items: [
                { text: "饮食", pinyin: "yǐn shí", en: "diet", zh: "吃喝方面" },
                { text: "营养", pinyin: "yíng yǎng", en: "nutrition", zh: "食物中的有益成分" },
                { text: "均衡", pinyin: "jūn héng", en: "balanced", zh: "各方面都适当" },
                { text: "蔬菜", pinyin: "shū cài", en: "vegetables", zh: "青菜类食物" },
                { text: "水果", pinyin: "shuǐ guǒ", en: "fruits", zh: "苹果、香蕉等" },
                { text: "油腻", pinyin: "yóu nì", en: "oily / greasy", zh: "油很多" },
                { text: "零食", pinyin: "líng shí", en: "snacks", zh: "正餐以外的小吃" },
                { text: "甜食", pinyin: "tián shí", en: "sweet food", zh: "糖分高的食物" },
                { text: "白开水", pinyin: "bái kāi shuǐ", en: "plain water", zh: "清水" },
                { text: "含糖饮料", pinyin: "hán táng yǐn liào", en: "sugary drinks", zh: "糖分高的饮料" },
                { text: "暴饮暴食", pinyin: "bào yǐn bào shí", en: "overeating", zh: "一次吃太多" },
                { text: "定时吃饭", pinyin: "dìng shí chī fàn", en: "eat on time", zh: "固定时间吃饭" }
            ]
        },
        {
            title: "第二关：句子练习",
            items: [
                { text: "健康的饮食对身体很重要。", pinyin: "Jiànkāng de yǐnshí duì shēntǐ hěn zhòngyào.", en: "A healthy diet is very important to the body.", zh: "应用：强调健康饮食的重要性。" },
                { text: "蔬菜和水果含有丰富的营养。", pinyin: "Shūcài hé shuǐguǒ hányǒu fēngfù de yíngyǎng.", en: "Vegetables and fruits contain rich nutrition.", zh: "应用：说明蔬菜和水果的养分价值。" },
                { text: "我们要保持均衡饮食。", pinyin: "Wǒmen yào bǎochí jūnhéng yǐnshí.", en: "We should maintain a balanced diet.", zh: "应用：建议日常要吃得合理和均衡。" },
                { text: "多吃蔬菜有助于身体健康。", pinyin: "Duō chī shūcài yǒuzhù yú shēntǐ jiànkāng.", en: "Eating more vegetables helps physical health.", zh: "应用：指出多吃蔬菜的具体好处。" },
                { text: "水果可以提供维生素。", pinyin: "Shuǐguǒ kěyǐ tígōng wéishēngsù.", en: "Fruits can provide vitamins.", zh: "应用：说明水果补充身体微量元素的功效。" },
                { text: "少吃油腻的食物比较健康。", pinyin: "Shǎo chī yóunì de shíwù bǐjiào jiànkāng.", en: "Eating less oily food is healthier.", zh: "应用：倡导清淡饮食以减轻身体负担。" },
                { text: "吃太多零食会影响正餐。", pinyin: "Chī tài duō língshí huì yǐngxiǎng zhèngcān.", en: "Eating too many snacks will affect regular meals.", zh: "应用：提醒学生零食要少吃、适量吃。" },
                { text: "吃太多甜食容易变胖。", pinyin: "Chī tài duō tiánshí róngyì biàn pàng.", en: "Eating too much sweet food makes it easy to get fat.", zh: "应用：警告高糖食品带来的肥胖风险。" },
                { text: "我们应该多喝白开水，少喝含糖饮料。", pinyin: "Wǒmen yīnggāi duō hē báikāishuǐ, shǎo hē hántáng yǐnliào.", en: "We should drink more plain water and fewer sugary drinks.", zh: "应用：提倡纯水、远离含糖饮料。" },
                { text: "常喝含糖饮料对健康不好。", pinyin: "Cháng hē hántáng yǐnliào duì jiànkāng bù hǎo.", en: "Regularly drinking sugary drinks is bad for health.", zh: "应用：指出甜饮料对身体的坏处。" },
                { text: "暴饮暴食会伤害肠胃。", pinyin: "Bàoyǐnbàoshí huì shānghài chángwèi.", en: "Overeating will hurt the stomach.", zh: "应用：警示过度饮食对消化系统的危害。" },
                { text: "定时吃饭有助于保持健康。", pinyin: "Dìngshí chīfàn yǒuzhù yú bǎochí jiànkāng.", en: "Eating on time helps stay healthy.", zh: "应用：强调规律进食好习惯的价值。" }
            ]
        }
    ];

    let currentLevelIdx = 0;
    let currentItemIdx = 0;
    let startTime = null;
    let totalErrors = 0;
    let totalChars = 0;
    let isFinished = false;
    let isComposing = false;

    const targetDisplay = document.getElementById('target-display');
    const typeInput = document.getElementById('type-input');
    const levelIndicator = document.getElementById('level-indicator');
    const progressIndicator = document.getElementById('progress');
    const resultScreen = document.getElementById('result-screen');
    const finalCelebration = document.getElementById('final-celebration');
    const gameContent = document.getElementById('game-content');
    const errorSound = document.getElementById('error-sound');
    const hintTrigger = document.getElementById('hint-trigger');
    const hintModal = document.getElementById('hint-modal');
    const closeHint = document.getElementById('close-hint');
    const speakBtn = document.getElementById('speak-btn');

    // 路线图 DOM
    const roadmapLine = document.getElementById('roadmap-line');
    const node1 = document.getElementById('node-1');
    const node2 = document.getElementById('node-2');
    const label1 = document.getElementById('label-1');
    const label2 = document.getElementById('label-2');

    function initLevel() {
        currentItemIdx = 0;
        totalErrors = 0;
        totalChars = 0;
        isFinished = false;
        startTime = null;
        levelIndicator.innerText = levels[currentLevelIdx].title;
        resultScreen.classList.add('hidden');
        finalCelebration.classList.add('hidden');
        gameContent.classList.remove('hidden');
        hintTrigger.classList.remove('hidden');
        typeInput.value = '';
        typeInput.focus();
        loadItem();
        updateRoadmap();
    }

    function loadItem() {
        const item = levels[currentLevelIdx].items[currentItemIdx];
        targetDisplay.innerHTML = '';
        progressIndicator.innerText = `当前进度: ${currentItemIdx + 1} / ${levels[currentLevelIdx].items.length}`;
        [...item.text].forEach(char => {
            const span = document.createElement('span');
            span.innerText = char;
            span.className = 'char default';
            targetDisplay.appendChild(span);
        });
        typeInput.value = '';
    }

    // 更新路线图进度线与状态
    function updateRoadmap() {
        const totalItems = levels[currentLevelIdx].items.length;
        let progressPercent = 0;

        if (currentLevelIdx === 0) {
            // 第一关：进度范围 0% - 50%
            const currentProgress = currentItemIdx / totalItems;
            progressPercent = currentProgress * 50;

            // 第一关激活状态
            node1.className = "w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-sm shadow-md border-4 border-white transition-all duration-300";
            label1.className = "text-xs font-bold text-emerald-600 mt-2";
            
            node2.className = "w-10 h-10 rounded-full bg-gray-200 text-gray-500 flex items-center justify-center font-bold text-sm shadow-sm border-4 border-white transition-all duration-300";
            label2.className = "text-xs font-medium text-gray-400 mt-2";
        } else {
            // 第二关：进度范围 50% - 100%
            const currentProgress = currentItemIdx / totalItems;
            progressPercent = 50 + (currentProgress * 50);

            // 第二关激活状态
            node1.className = "w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold text-sm shadow-sm border-4 border-white transition-all duration-300";
            label1.className = "text-xs font-medium text-emerald-400 mt-2";

            node2.className = "w-10 h-10 rounded-full bg-emerald-500 text-white flex items-center justify-center font-bold text-sm shadow-md border-4 border-white transition-all duration-300";
            label2.className = "text-xs font-bold text-emerald-600 mt-2";
        }

        roadmapLine.style.width = `${progressPercent}%`;
    }

    speakBtn.onclick = () => {
        const textToSpeak = levels[currentLevelIdx].items[currentItemIdx].text;
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.8;
        speechSynthesis.speak(utterance);
        typeInput.focus();
    };

    hintTrigger.onclick = () => {
        const item = levels[currentLevelIdx].items[currentItemIdx];
        document.getElementById('hint-pinyin').innerText = item.pinyin;
        document.getElementById('hint-english').innerText = item.en;
        document.getElementById('hint-chinese').innerText = item.zh;
        hintModal.classList.remove('hidden');
    };

    closeHint.onclick = () => {
        hintModal.classList.add('hidden');
        typeInput.focus();
    };

    typeInput.addEventListener('compositionstart', () => { isComposing = true; });
    typeInput.addEventListener('compositionend', () => { isComposing = false; handleInput(); });
    typeInput.addEventListener('input', () => { if (!isComposing) handleInput(); });

    // 强效防作弊：禁止在输入框中使用粘贴、复制或剪切功能
    typeInput.addEventListener('paste', e => e.preventDefault());
    typeInput.addEventListener('copy', e => e.preventDefault());
    typeInput.addEventListener('cut', e => e.preventDefault());

    function handleInput() {
        if (isFinished) return;
        if (!startTime) startTime = new Date();
        const typedValue = typeInput.value;
        const targetText = levels[currentLevelIdx].items[currentItemIdx].text;
        const spans = targetDisplay.querySelectorAll('.char');
        
        for (let i = 0; i < targetText.length; i++) {
            if (i < typedValue.length) {
                if (typedValue[i] === targetText[i]) {
                    spans[i].className = 'char correct';
                } else {
                    if (spans[i].className !== 'char wrong') {
                        errorSound.currentTime = 0;
                        errorSound.play().catch(e => {});
                        totalErrors++;
                    }
                    spans[i].className = 'char wrong';
                }
            } else {
                spans[i].className = 'char default';
            }
        }
        
        if (typedValue === targetText) {
            totalChars += targetText.length;
            currentItemIdx++;
            updateRoadmap();
            if (currentItemIdx < levels[currentLevelIdx].items.length) {
                setTimeout(loadItem, 300);
            } else {
                showResults();
            }
        }
    }

    function showResults() {
        isFinished = true;
        const duration = Math.floor((new Date() - startTime) / 1000);
        const accuracy = Math.max(0, Math.round((totalChars / (totalChars + totalErrors)) * 100));
        document.getElementById('accuracy-val').innerText = accuracy + '%';
        document.getElementById('time-val').innerText = duration + '秒';
        let stars = accuracy >= 98 ? 5 : accuracy >= 90 ? 4 : accuracy >= 75 ? 3 : accuracy >= 60 ? 2 : 1;
        document.getElementById('stars').innerText = '★'.repeat(stars) + '☆'.repeat(5 - stars);
        gameContent.classList.add('hidden');
        hintTrigger.classList.add('hidden');
        resultScreen.classList.remove('hidden');
        
        // 确保第一关结算时，顶部进度线精确连接到中点 (50%)
        if (currentLevelIdx === 0) {
            roadmapLine.style.width = '50%';
        } else {
            roadmapLine.style.width = '100%';
        }

        const nextBtn = document.getElementById('next-btn');
        if (currentLevelIdx >= levels.length - 1) {
            nextBtn.innerText = "完成整个挑战";
            nextBtn.onclick = () => {
                resultScreen.classList.add('hidden');
                finalCelebration.classList.remove('hidden');
            };
        } else {
            nextBtn.innerText = "继续挑战：进入句子练习 ➔";
            nextBtn.onclick = goToNextLevel;
        }
    }

    function restartLevel() { initLevel(); }
    function goToNextLevel() { if (currentLevelIdx < levels.length - 1) { currentLevelIdx++; initLevel(); } }
    window.onload = initLevel;
</script>

</body>
</html>
